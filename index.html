<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPON AI</title>

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  background:#10131c;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  height:100vh;
  overflow:hidden;
}

.sidebar {
  width:260px;
  background:#171c29;
  padding:18px;
  display:flex;
  flex-direction:column;
  border-right:1px solid #30394d;
}

.logo {
  text-align:center;
  font-size:25px;
  font-weight:bold;
  margin:12px 0 25px;
}

.newchat {
  width:100%;
  background:#6475ed;
  margin-bottom:20px;
}

.history-title {
  color:#9ba8c7;
  font-size:13px;
  margin-bottom:10px;
}

#chatList {
  overflow-y:auto;
  flex:1;
}

.chat-item {
  padding:12px;
  border-radius:9px;
  margin-bottom:7px;
  background:#252b3b;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  gap:5px;
}

.chat-item.active {
  background:#39446b;
}

.chat-item span {
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.delete {
  background:transparent;
  padding:2px 5px;
  color:#ff7785;
}

.main {
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
  padding:20px;
}

header {
  text-align:center;
  padding:10px;
}

h1 {
  font-size:35px;
  margin:5px;
}

.subtitle {
  color:#a5b4fc;
}

.modes {
  display:flex;
  gap:12px;
  max-width:500px;
  width:100%;
  margin:15px auto;
}

button {
  border:0;
  border-radius:10px;
  padding:13px;
  color:white;
  background:#6475ed;
  cursor:pointer;
}

.mode {
  flex:1;
  background:#252b3b;
  border:2px solid transparent;
}

.mode.active.good {
  background:#174b36;
  border-color:#38d996;
}

.mode.active.bad {
  background:#59252d;
  border-color:#ff596b;
}

#modeInfo {
  text-align:center;
  color:#a5b4fc;
  font-size:13px;
}

#chat {
  flex:1;
  overflow-y:auto;
  padding:15px;
  max-width:850px;
  width:100%;
  margin:auto;
}

.message {
  padding:14px;
  margin:12px 0;
  border-radius:12px;
  background:#252b3b;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user {
  background:#39446b;
  margin-left:40px;
}

.assistant {
  margin-right:40px;
}

.welcome {
  text-align:center;
  color:#a5b4fc;
  margin-top:80px;
}

form {
  display:flex;
  gap:10px;
  max-width:850px;
  width:100%;
  margin:10px auto;
}

input {
  flex:1;
  min-width:0;
  padding:16px;
  border:0;
  border-radius:12px;
  background:#252b3b;
  color:white;
  outline:none;
}

button:disabled {
  opacity:.6;
}

@media(max-width:650px) {
  .sidebar {
    width:125px;
    padding:8px;
  }

  .logo { font-size:18px; }

  .chat-item { font-size:11px; }

  .delete { padding:2px; }

  .main { padding:8px; }

  h1 { font-size:28px; }

  .message { margin-left:0; margin-right:0; }
}
</style>
</head>

<body>

<aside class="sidebar">
  <div class="logo">IPON AI</div>

  <button class="newchat" id="newChat">
    + Yeni Sohbet
  </button>

  <div class="history-title">SOHBET GEÇMİŞİ</div>

  <div id="chatList"></div>
</aside>

<main class="main">

<header>
  <h1>IPON AI</h1>
  <p class="subtitle">İSİM ABLAMDAN İLHAMLA</p>
</header>

<div class="modes">
  <button class="mode good" id="goodMode">😇 İYİ MOD</button>
  <button class="mode bad" id="badMode">😈 KÖTÜ MOD</button>
</div>

<p id="modeInfo"></p>

<div id="chat"></div>

<form id="form">
  <input id="message" placeholder="IPON AI'ye mesaj yaz..." required>
  <button id="sendButton">Gönder</button>
</form>

</main>

<script>
const chat = document.getElementById("chat");
const chatList = document.getElementById("chatList");
const form = document.getElementById("form");
const input = document.getElementById("message");

let mode = localStorage.getItem("ipon_mode") || "good";
let chats = [];
let currentChat = null;

try {
  chats = JSON.parse(localStorage.getItem("ipon_chats") || "[]");

  if (!Array.isArray(chats)) chats = [];
} catch {
  chats = [];
}

// Eski sohbetleri yeni sisteme aktar
if (chats.length === 0) {
  try {
    const oldMessages = JSON.parse(
      localStorage.getItem("ipon_messages") || "[]"
    );

    if (Array.isArray(oldMessages) && oldMessages.length) {
      chats.push({
        id: Date.now(),
        title: "Eski sohbet",
        messages: oldMessages
      });
    }
  } catch {}
}

function saveChats() {
  localStorage.setItem("ipon_chats", JSON.stringify(chats));
}

function newChat() {
  const id = Date.now();

  chats.unshift({
    id,
    title: "Yeni Sohbet",
    messages: []
  });

  currentChat = id;

  saveChats();
  render();
}

function render() {
  chatList.innerHTML = "";

  chats.forEach(c => {
    const item = document.createElement("div");
    item.className = "chat-item" +
      (c.id === currentChat ? " active" : "");

    const title = document.createElement("span");
    title.textContent = c.title;

    title.onclick = () => {
      currentChat = c.id;
      render();
    };

    const del = document.createElement("button");
    del.className = "delete";
    del.textContent = "✕";

    del.onclick = e => {
      e.stopPropagation();

      chats = chats.filter(x => x.id !== c.id);

      if (currentChat === c.id) {
        currentChat = chats.length ? chats[0].id : null;
      }

      saveChats();

      if (!currentChat) newChat();
      else render();
    };

    item.append(title, del);
    chatList.appendChild(item);
  });

  chat.innerHTML = "";

  const selected = chats.find(c => c.id === currentChat);

  if (!selected || selected.messages.length === 0) {
    chat.innerHTML =
      '<div class="welcome"><h2>IPON AI\'ye Hoş Geldin!</h2><p>Nasıl yardımcı olabilirim?</p></div>';
  } else {
    selected.messages.forEach(m => {
      addMessage(m.role, m.content);
    });
  }

  updateMode();
}

function addMessage(role, content) {
  const div = document.createElement("div");

  div.className = "message " +
    (role === "user" ? "user" : "assistant");

  div.textContent = content;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function updateMode() {
  document.getElementById("goodMode")
    .classList.toggle("active", mode === "good");

  document.getElementById("badMode")
    .classList.toggle("active", mode === "bad");

  document.getElementById("modeInfo").textContent =
    mode === "good"
    ? "Şu anda İyi Moddasın 😇"
    : "Şu anda Kötü Moddasın 😈";

  input.placeholder = mode === "good"
    ? "IPON AI'ye mesaj yaz..."
    : "IPON AI'yi kızdır bakalım 😈";
}

function changeMode(value) {
  mode = value;
  localStorage.setItem("ipon_mode", mode);
  updateMode();
}

document.getElementById("goodMode").onclick =
  () => changeMode("good");

document.getElementById("badMode").onclick =
  () => changeMode("bad");

document.getElementById("newChat").onclick = newChat;

form.addEventListener("submit", async e => {
  e.preventDefault();

  const content = input.value.trim();
  if (!content) return;

  if (!currentChat) newChat();

  const selected = chats.find(c => c.id === currentChat);

  selected.messages.push({
    role:"user",
    content
  });

  if (selected.title === "Yeni Sohbet") {
    selected.title = content.slice(0,25);
  }

  addMessage("user", content);

  input.value = "";
  saveChats();
  renderHistoryOnly();

  const sendButton = document.getElementById("sendButton");
  sendButton.disabled = true;

  try {
    const response = await fetch("/api/chat", {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        messages:selected.messages.slice(-20),
        mode
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Bağlantı hatası.");
    }

    if (typeof data.answer !== "string") {
      throw new Error("Geçersiz cevap.");
    }

    selected.messages.push({
      role:"assistant",
      content:data.answer
    });

    saveChats();
    addMessage("assistant", data.answer);

  } catch(error) {
    addMessage("assistant", "Hata: " + error.message);
  }

  sendButton.disabled = false;
  input.focus();
});

function renderHistoryOnly() {
  const selected = currentChat;

  chatList.innerHTML = "";

  chats.forEach(c => {
    const item = document.createElement("div");
    item.className = "chat-item" +
      (c.id === selected ? " active" : "");

    const title = document.createElement("span");
    title.textContent = c.title;

    title.onclick = () => {
      currentChat = c.id;
      render();
    };

    const del = document.createElement("button");
    del.className = "delete";
    del.textContent = "✕";

    del.onclick = e => {
      e.stopPropagation();
      chats = chats.filter(x => x.id !== c.id);

      if (currentChat === c.id) {
        currentChat = chats.length ? chats[0].id : null;
      }

      saveChats();

      if (!currentChat) newChat();
      else render();
    };

    item.append(title, del);
    chatList.appendChild(item);
  });
}

if (chats.length) {
  currentChat = chats[0].id;
} else {
  newChat();
}

render();
</script>

</body>
</html>
