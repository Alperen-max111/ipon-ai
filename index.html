<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPON AI</title>

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  background:#10131c;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  height:100vh;
  overflow:hidden;
}

button {
  border:0;
  border-radius:10px;
  padding:12px;
  color:white;
  background:#6475ed;
  cursor:pointer;
}

.sidebar {
  width:250px;
  background:#171c29;
  padding:15px;
  display:flex;
  flex-direction:column;
  border-right:1px solid #30394d;
}

.logo {
  text-align:center;
  font-size:25px;
  font-weight:bold;
  margin:15px 0 25px;
}

.newchat {
  width:100%;
  margin-bottom:20px;
}

.history-title {
  color:#9ba8c7;
  font-size:13px;
  margin-bottom:10px;
}

#chatList {
  overflow-y:auto;
  flex:1;
}

.chat-item {
  padding:11px;
  border-radius:9px;
  margin-bottom:7px;
  background:#252b3b;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  gap:5px;
}

.chat-item.active {
  background:#39446b;
}

.chat-item span {
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.delete {
  background:transparent;
  color:#ff7785;
  padding:2px 5px;
}

.main {
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
  padding:15px;
}

header {
  text-align:center;
  padding:10px;
}

h1 {
  font-size:36px;
  margin:5px;
}

.subtitle {
  color:#a5b4fc;
}

.admin-btn {
  background:#b58a25;
  margin:8px auto;
  display:block;
}

.modes {
  display:flex;
  gap:12px;
  max-width:500px;
  width:100%;
  margin:12px auto;
}

.mode {
  flex:1;
  background:#252b3b;
  border:2px solid transparent;
}

.mode.active.good {
  background:#174b36;
  border-color:#38d996;
}

.mode.active.bad {
  background:#59252d;
  border-color:#ff596b;
}

#modeInfo {
  text-align:center;
  color:#a5b4fc;
  font-size:13px;
}

#chat {
  flex:1;
  overflow-y:auto;
  padding:15px;
  max-width:850px;
  width:100%;
  margin:auto;
}

.message {
  padding:14px;
  margin:12px 0;
  border-radius:12px;
  background:#252b3b;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user {
  background:#39446b;
  margin-left:40px;
}

.assistant {
  margin-right:40px;
}

.welcome {
  text-align:center;
  color:#a5b4fc;
  margin-top:80px;
}

form {
  display:flex;
  gap:10px;
  max-width:850px;
  width:100%;
  margin:10px auto;
}

input {
  flex:1;
  min-width:0;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#252b3b;
  color:white;
  outline:none;
}

.panel {
  display:none;
  background:#20283a;
  border:1px solid #b58a25;
  border-radius:15px;
  padding:20px;
  max-width:500px;
  width:100%;
  margin:10px auto;
  text-align:center;
}

.panel input {
  width:100%;
  margin:10px 0;
}

.panel button {
  margin:5px;
}

.host-title {
  color:#f4c542;
  font-size:24px;
}

#adminError {
  color:#ff6978;
}

#adminStatus {
  color:#38d996;
}

button:disabled {
  opacity:.6;
  cursor:not-allowed;
}

@media(max-width:600px) {
  .sidebar {
    width:115px;
    padding:7px;
  }

  .logo { font-size:17px; }

  .chat-item { font-size:11px; }

  .main { padding:6px; }

  h1 { font-size:27px; }

  .message {
    margin-left:0;
    margin-right:0;
  }

  .history-title { font-size:10px; }
}
</style>
</head>

<body>

<aside class="sidebar">

<div class="logo">IPON AI</div>

<button class="newchat" id="newChat">
+ Yeni Sohbet
</button>

<div class="history-title">SOHBETLER</div>

<div id="chatList"></div>

</aside>

<main class="main">

<header>
<h1>IPON AI</h1>
<p class="subtitle">İSİM ABLAMDAN İLHAMLA</p>

<button class="admin-btn" id="adminLoginBtn">
👑 HOST GİRİŞİ
</button>
</header>

<!-- ADMIN GİRİŞ -->

<div class="panel" id="adminLogin">

<h2>🔐 HOST GİRİŞİ</h2>

<input
id="adminPassword"
type="password"
placeholder="Admin şifresi"
>

<button id="loginButton">GİRİŞ YAP</button>

<p id="adminError"></p>

</div>

<!-- ADMIN PANEL -->

<div class="panel" id="adminPanel">

<h2 class="host-title">👑 IPON AI HOST PANELİ</h2>

<h3>Hoş geldin Alperen!</h3>

<p id="adminStatus">HOST yetkisi aktif!</p>

<hr>

<p>Yetki: HOST / ADMIN</p>

<p>Proje: IPON AI</p>

<p>Durum: Aktif</p>

<button onclick="adminLogout()">
🚪 ÇIKIŞ YAP
</button>

</div>

<!-- MODLAR -->

<div class="modes">

<button class="mode good" id="goodMode">
😇 İYİ MOD
</button>

<button class="mode bad" id="badMode">
😈 KÖTÜ MOD
</button>

</div>

<p id="modeInfo"></p>

<!-- SOHBET -->

<div id="chat"></div>

<form id="form">

<input
id="message"
placeholder="IPON AI'ye mesaj yaz..."
required
>

<button id="sendButton">Gönder</button>

</form>

</main>

<script>

const chat = document.getElementById("chat");
const chatList = document.getElementById("chatList");
const form = document.getElementById("form");
const input = document.getElementById("message");

let mode = localStorage.getItem("ipon_mode") || "good";
let chats = [];
let currentChat = null;

const ADMIN_TOKEN = "ipon_admin_token";

// SOHBETLERİ YÜKLE

try {

chats = JSON.parse(
localStorage.getItem("ipon_chats") || "[]"
);

if (!Array.isArray(chats)) chats = [];

} catch {
chats = [];
}

// ESKİ SOHBETLERİ AKTAR

if (chats.length === 0) {

try {

const old = JSON.parse(
localStorage.getItem("ipon_messages") || "[]"
);

if (Array.isArray(old) && old.length) {

chats.push({
id:Date.now(),
title:"Eski sohbet",
messages:old
});

}

} catch {}

}

function saveChats() {

localStorage.setItem(
"ipon_chats",
JSON.stringify(chats)
);

}

function addMessage(role,content) {

const div = document.createElement("div");

div.className =
"message " +
(role === "user" ? "user" : "assistant");

div.textContent = content;

chat.appendChild(div);

chat.scrollTop = chat.scrollHeight;

}

// YENİ SOHBET

function newChat() {

const id = Date.now();

chats.unshift({
id,
title:"Yeni Sohbet",
messages:[]
});

currentChat = id;

saveChats();

render();

}

// SOHBETLERİ GÖSTER

function render() {

chatList.innerHTML = "";

chats.forEach(c => {

const item = document.createElement("div");

item.className =
"chat-item" +
(c.id === currentChat ? " active" : "");

const title = document.createElement("span");

title.textContent = c.title;

title.onclick = () => {

currentChat = c.id;
render();

};

const del = document.createElement("button");

del.className = "delete";
del.textContent = "✕";

del.onclick = e => {

e.stopPropagation();

chats = chats.filter(x => x.id !== c.id);

if (currentChat === c.id) {
currentChat = chats.length ? chats[0].id : null;
}

saveChats();

if (!currentChat) newChat();
else render();

};

item.append(title,del);

chatList.appendChild(item);

});

chat.innerHTML = "";

const selected = chats.find(
c => c.id === currentChat
);

if (!selected || selected.messages.length === 0) {

chat.innerHTML = `
<div class="welcome">
<h2>IPON AI'ye Hoş Geldin!</h2>
<p>Nasıl yardımcı olabilirim?</p>
</div>
`;

} else {

selected.messages.forEach(m => {
addMessage(m.role,m.content);
});

}

updateMode();

}

// MOD SİSTEMİ

function updateMode() {

document.getElementById("goodMode")
.classList.toggle("active",mode === "good");

document.getElementById("badMode")
.classList.toggle("active",mode === "bad");

document.getElementById("modeInfo").textContent =
mode === "good"
? "Şu anda İyi Moddasın 😇"
: "Şu anda Kötü Moddasın 😈";

input.placeholder =
mode === "good"
? "IPON AI'ye mesaj yaz..."
: "IPON AI'yi kızdır bakalım 😈";

}

function changeMode(value) {

mode = value;

localStorage.setItem("ipon_mode",mode);

updateMode();

}

document.getElementById("goodMode").onclick =
() => changeMode("good");

document.getElementById("badMode").onclick =
() => changeMode("bad");

document.getElementById("newChat").onclick =
newChat;

// MESAJ GÖNDERME

form.addEventListener("submit",async e => {

e.preventDefault();

const content = input.value.trim();

if (!content) return;

if (!currentChat) newChat();

const selected = chats.find(
c => c.id === currentChat
);

selected.messages.push({
role:"user",
content
});

if (selected.title === "Yeni Sohbet") {
selected.title = content.slice(0,25);
}

saveChats();

render();

const sendButton =
document.getElementById("sendButton");

sendButton.disabled = true;

try {

const response = await fetch("/api/chat",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

messages:selected.messages.slice(-20),
mode

})

});

const data = await response.json();

if (!response.ok) {
throw new Error(data.error || "Bağlantı hatası");
}

if (typeof data.answer !== "string") {
throw new Error("Geçersiz cevap");
}

selected.messages.push({
role:"assistant",
content:data.answer
});

saveChats();

if (currentChat === selected.id) {
render();
}

} catch(error) {

if (currentChat === selected.id) {
addMessage(
"assistant",
"Bağlantı hatası: " + error.message
);
}

} finally {

sendButton.disabled = false;
input.focus();

}

});

// ADMIN SİSTEMİ

const adminLoginBtn =
document.getElementById("adminLoginBtn");

adminLoginBtn.onclick = async () => {

const token = localStorage.getItem(ADMIN_TOKEN);

if (token) {

try {

const response = await fetch(
"/api/admin/check",
{
headers:{
Authorization:"Bearer " + token
}
}
);

if (response.ok) {

document.getElementById("adminPanel")
.style.display = "block";

document.getElementById("adminLogin")
.style.display = "none";

return;

}

} catch {}

localStorage.removeItem(ADMIN_TOKEN);

}

document.getElementById("adminLogin")
.style.display = "block";

document.getElementById("adminPanel")
.style.display = "none";

};

// ADMIN GİRİŞ

async function adminLogin() {

const password =
document.getElementById("adminPassword").value;

const error =
document.getElementById("adminError");

error.textContent = "";

try {

const response = await fetch(
"/api/admin/login",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({password})

});

const data = await response.json();

if (!response.ok) {
throw new Error(data.error || "Giriş başarısız");
}

localStorage.setItem(
ADMIN_TOKEN,
data.token
);

document.getElementById("adminLogin")
.style.display = "none";

document.getElementById("adminPanel")
.style.display = "block";

document.getElementById("adminPassword").value = "";

} catch(e) {

error.textContent = e.message;

}

}

document.getElementById("loginButton").onclick =
adminLogin;

// ENTER İLE GİRİŞ

document.getElementById("adminPassword")
.addEventListener("keydown",e => {

if (e.key === "Enter") adminLogin();

});

// ADMIN ÇIKIŞ

function adminLogout() {

localStorage.removeItem(ADMIN_TOKEN);

document.getElementById("adminPanel")
.style.display = "none";

document.getElementById("adminLogin")
.style.display = "none";

}

// BAŞLAT

if (chats.length) {

currentChat = chats[0].id;

} else {

newChat();

}

render();

</script>

</body>
</html>
